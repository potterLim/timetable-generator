<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Timetable Generator 홈">
          <span class="brand__mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span>Timetable Generator</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
          <a href="{{ '/terms/' | relative_url }}">이용약관</a>
          <a href="https://github.com/potterLim/timetable-generator">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>Timetable Generator는 한동대학교의 공식 서비스가 아닌 개인 프로젝트입니다.</p>
        <div class="site-footer__links">
          <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
          <a href="{{ '/terms/' | relative_url }}">이용약관</a>
          <a href="https://github.com/potterLim/timetable-generator/issues">지원</a>
        </div>
      </div>
    </footer>
  </body>
</html>
