<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111722" media="(prefers-color-scheme: dark)">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/screenshots/timetable-overview.png' | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1800">
    <meta property="og:image:height" content="1036">
    <meta property="og:image:alt" content="Timetable Generator에서 과목 검색 결과와 주간 시간표를 확인하는 화면">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/screenshots/timetable-overview.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="Timetable Generator에서 과목 검색 결과와 주간 시간표를 확인하는 화면">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/app-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a
          class="brand"
          href="{{ '/' | relative_url }}"
          aria-label="Timetable Generator 홈"
          {% if page.url == '/' %}aria-current="page"{% endif %}>
          <span class="brand__mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span>Timetable Generator</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a
            href="{{ '/guide/' | relative_url }}"
            {% if page.url == '/guide/' %}aria-current="page"{% endif %}>사용 방법</a>
          <a href="https://github.com/potterLim/timetable-generator">GitHub</a>
          <a class="site-nav__download" href="https://github.com/potterLim/timetable-generator/releases">다운로드</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>Timetable Generator는 한동대학교의 공식 서비스가 아닌 개인 프로젝트입니다.</p>
        <div class="site-footer__links">
          <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
          <a href="{{ '/terms/' | relative_url }}">이용약관</a>
          <a href="https://github.com/potterLim/timetable-generator/issues">지원</a>
          <a href="https://github.com/potterLim/timetable-generator">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
